# Builds the site and deploys it to Cloudflare Pages on every push to main (or by hand from the Actions tab).
# Needs three repository secrets:
#   CLOUDFLARE_API_TOKEN     Cloudflare API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID    the Cloudflare account ID
#   PUYO_ASSETS_TOKEN    GitHub token that can read ceaser501/taebo-games-puyo-puyo2-assets
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUYO_ASSETS_TOKEN: ${{ secrets.PUYO_ASSETS_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUYO_ASSETS_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Deploy skipped; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Check out the original game data
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ceaser501/taebo-games-puyo-puyo2-assets
          token: ${{ secrets.PUYO_ASSETS_TOKEN }}
          path: puyo-assets

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run puyo:assets -- puyo-assets
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The first run creates the Pages project; later runs find it already there.
          npx -y wrangler@3 pages project create taesu-puyo2 --production-branch main || true
          npm run deploy
